services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
